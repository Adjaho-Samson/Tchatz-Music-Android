
name: Build Tchatz Music Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compile Android application
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Autoriser Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compiler l'APK debug
        run: ./gradlew assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Tchatz-Music-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
