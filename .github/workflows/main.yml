
name: Build Tchatz Music Android

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compile Android application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Tchatz-Musique

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Autoriser Gradle Wrapper
        run: chmod +x gradlew

      - name: Compiler l'APK
        run: ./gradlew :app:assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Tchatz-Music-debug-APK
          path: Tchatz-Musique/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
