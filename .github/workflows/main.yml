name: Build Tchatz Music Android

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'arena/9626101b-tchatz-music-android'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Tests, Lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Tchatz-Music
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: List Gradle tasks
        run: ./gradlew --no-daemon :app:tasks --all
      - name: Unit tests, Android Lint and debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee gradle-build.log
      - name: Verify APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk"
          sha256sum "$apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tchatz-Music-debug-APK
          path: Tchatz-Music/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-diagnostics
          path: |
            Tchatz-Music/gradle-build.log
            Tchatz-Music/app/build/reports/
            Tchatz-Music/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  device-tests:
    name: Instrumented tests on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x Tchatz-Music/gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd Tchatz-Music && ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-instrumentation
          path: |
            Tchatz-Music/app/build/reports/androidTests/
            Tchatz-Music/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
